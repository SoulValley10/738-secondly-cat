name: Post Daily Cat

on:
  # Allows you to click a button in GitHub to test it anytime
  workflow_dispatch:
  # Runs automatically at 9:00 AM and 6:00 PM (18:00) every day
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Europe/London'
    - cron: '0 18 * * *'
      timezone: 'Europe/London'

jobs:
  post-cat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run cat script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python send_cat.py
